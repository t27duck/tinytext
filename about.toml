# cargo-about configuration: generates dist/THIRD-PARTY-LICENSES.
# Licenses are listed in order of preference for dual-licensed crates.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
